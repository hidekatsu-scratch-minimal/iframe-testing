<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL iFrame Viewer</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* dvh未対応ブラウザ向けのフォールバック */
            height: 100vh;
            /* 動的ビューポート（dvh）で画面にぴったり合わせる */
            height: 100dvh;
            font-family: sans-serif;
            background-color: #f5f5f5;
            overflow: hidden;
        }
        .input-area {
            padding: 10px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }
        input[type="url"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .iframe-container {
            width: 100%;
            height: 100%;
            padding-top: 55px; /* 入力エリアの高さ分空ける */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="input-area">
        <input type="url" id="urlInput" placeholder="https://example.com と入力（Enterでも表示）" value="https://">
        <button id="loadBtn">表示する</button>
    </div>

    <div class="iframe-container">
        <iframe id="targetFrame" src="about:blank"></iframe>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const loadBtn = document.getElementById('loadBtn');
        const targetFrame = document.getElementById('targetFrame');

        function loadIframe() {
            let url = urlInput.value.trim();
            if (url) {
                if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                    urlInput.value = url;
                }
                targetFrame.src = url;
            }
        }

        loadBtn.addEventListener('click', loadIframe);

        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadIframe();
            }
        });
    </script>
</body>
</html>
